[package]
name = "aem-environment-manager"
version = "0.1.0"
description = "Desktop app to start, stop and inspect local AEM Author/Publish instances"
edition = "2021"

[lib]
name = "aem_environment_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
